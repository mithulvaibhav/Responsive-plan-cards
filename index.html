<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assessment</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="top">
        <h1>SELECT PLANS</h1>
    </header>

    <main class="price">
        <article class="card card-1">
            <div>
                <h2>Basic</h2>
                <p class="price-tag">$10/month</p>
                <ul class="features">
                    <li>Feature 1</li>
                    <li>Feature 2</li>
                    <li>Feature 3</li>
                </ul>
            </div>
            <button class="btn" type="button">Select </button>
        </article>

        <article class="card card-2">
            <div>
                <h2>Standard</h2>
                <p class="price-tag">$25/month</p>
                <ul class="features">
                    <li>Feature 1</li>
                    <li>Feature 2</li>
                    <li>Feature 3</li>
                </ul>
            </div>
            <button class="btn" type="button">Select</button>
        </article>

        <article class="card card-3">
            <div>
                <h2>Pro</h2>
                <p class="price-tag">$145/month</p>
                <ul class="features">
                    <li>Feature 1</li>
                    <li>Feature 2</li>
                    <li>Feature 3</li>
                </ul>
            </div>
            <button class="btn" type="button">Contact Support</button>
        </article>
    </main>
</body>
</html>
